<!-- The site navigation, shared by every page. console/server.mjs inlines this
     file wherever a page carries the include:nav marker, and marks the link
     for the page being served with aria-current. To add a page to the menu,
     add a link here — and its route to PAGES in server.mjs. -->
<style>
nav.sitenav {
  display:flex; flex-wrap:wrap; gap:4px; align-items:center;
  margin:0 0 26px; padding-bottom:14px; border-bottom:1px solid var(--line-soft);
}
nav.sitenav a {
  font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;
  font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.07em;
  color:var(--muted); text-decoration:none; padding:6px 11px; border-radius:5px;
}
nav.sitenav a:hover { color:var(--ink); background:var(--surface-2); }
nav.sitenav a[aria-current="page"] { color:var(--accent); background:var(--accent-wash); }
nav.sitenav .navspace { flex:1 1 20px; }
nav.sitenav .navrepo { font-size:12px; letter-spacing:.04em; text-transform:none; }
</style>
<nav class="sitenav" aria-label="Site">
  <a href="/">What it does</a>
  <a href="/how-to-run">How to run</a>

</nav>
