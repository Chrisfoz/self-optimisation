# Reconstructed, not generated. This is carrotgame's real configuration,
# read back out of its enforcement code rather than its prose docs, so that
# this file is a test of whether the schema below can actually represent a
# real installation — not a paraphrase of SELF-IMPROVEMENT.md.
#
# Source of every value is cited inline. Where the paper outline's §5 sketch
# didn't have a field for something the real project needed, one was added
# here rather than dropping the value — see NOTES.md for what that exposed.
#
# WHERE THIS FILE ACTUALLY LIVES: in a real installation, project-adapter.yml
# belongs at THAT project's own repository root — harness/lib/adapter.mjs
# defaults to looking for it at process.cwd()/project-adapter.yml. This copy
# is kept inside self_optimisation's examples/ folder purely as the schema's
# worked reference; it is never loaded by anything and is not meant to be
# copied verbatim. Start from harness/project-adapter.example.yml instead —
# it's the generic, bracketed-placeholder version meant to be copied.

project:
  id: carrotgame
  repository: https://github.com/Chrisfoz/carrotgame
  default_branch: main

constitution:
  # scripts/lib/edit-format.mjs — EDITABLE_FILES. Single definition; the
  # prompt's source list and the snapshot/restore list both derive from it.
  allowed_paths:
    - carrot_maze_game.html
    - germ_fighter.html
    - index.html
    - about.html
    - germ_fun_facts.html
    - vegetable_fun_facts.html
    - styles.css
    - SELF-IMPROVEMENT.md          # editable, but sent as the generation log, not as source

  # scripts/lib/edit-format.mjs — CREATABLE_PATTERNS. A CREATE block may add
  # a new path matching this; it may never target a path that already exists.
  create_only_paths:
    - 'tests/game-logic/*.test.js'

  # scripts/check-guarded-paths.mjs — FROZEN. May not change at all, on an
  # agent branch. Enforced twice: as an allowlist before anything is written,
  # and again here in CI against the diff.
  frozen_paths:
    - '.github/**'
    - '.claude/agents/self-improvement.md'
    - 'scripts/check-guarded-paths.mjs'
    - 'netlify.toml'
    - 'feedback.js'
    - 'CLAUDE.md'
    - '.gitignore'

  # scripts/check-guarded-paths.mjs — APPEND_ONLY. New files may be added;
  # existing ones may not be edited or removed.
  append_only_paths:
    - 'tests/**'

  # scripts/check-guarded-paths.mjs — FROZEN_FIELDS. Named JSON fields must
  # be byte-identical even if the rest of the file changes.
  frozen_fields:
    package.json:
      - scripts

  # scripts/check-guarded-paths.mjs — MAX_FILES / MAX_LINES. A backstop
  # against a run that has lost the plot, not a design constraint: it has
  # never been the reason a generation failed.
  churn_ceiling:
    max_files: 50
    max_lines: 10000

  # No clinical users yet (SELF-IMPROVEMENT.md, "Auto-merge: reaffirmed").
  # The moment that changes, this flips to human-approval-required — recorded
  # as a decision, not inferred from the code, because nothing in the code
  # would tell you the trigger for changing it.
  approval_class: autonomous-merge

context:
  # scripts/lib/context-pack.mjs sends every editable file in full. Viable
  # here because the whole editable surface is ~7 small HTML/CSS files.
  # See Portable-Harness-Design.md §8.2 — this strategy has never been
  # tested past this project's size, and "scoped" has no reference
  # implementation yet.
  strategy: full-dump

  # scripts/lib/context-pack.mjs — buildGenerationIndex() (all generations,
  # one line each) + buildGenerationHistory() (full detail, recent only).
  # The index exists because the history window used to be the only memory
  # and silently aged out everything before generation 010.
  history_window:
    index_covers: all-generations
    full_detail_recent: 3

  # scripts/lib/context-pack.mjs — the blocks assembled per suggestion call.
  blocks:
    - repository-map
    - frozen-test-invariant-names       # names only, not bodies
    - generation-index                  # every generation, one line each
    - generation-history                # 3 most recent, full detail
    - recurring-themes                  # latest every-10th-generation review
    - open-escalations
    - player-feedback                   # optional — omitted entirely if Supabase env vars absent
    - screenshots
    - target-platform-notes             # static, not live-fetched
    - readiness-scorecard
    - architecture-notes                # SELF-IMPROVEMENT.md, everything above the generation log, in full
    - current-source                    # every allowed_paths file, in full

providers:
  # .github/workflows/self-improvement.yml — every lab with a secret wired
  # in. A lab whose models can trigger a run but whose key is missing
  # produces a run that cannot execute.
  watched:
    - {lab: anthropic, env_var: ANTHROPIC_API_KEY}
    - {lab: openai,    env_var: OPENAI_API_KEY}
    - {lab: google,    env_var: GOOGLE_API_KEY}
    - {lab: moonshot,  env_var: MOONSHOT_API_KEY}
    - {lab: deepseek,  env_var: DEEPSEEK_API_KEY}
    - {lab: qwen,      env_var: QWEN_API_KEY}
    - {lab: xai,       env_var: XAI_API_KEY}
    - {lab: meta,      env_var: META_API_KEY}
    - {lab: zai,       env_var: ZAI_API_KEY}
  # .agent/model-snapshot.json — which models have already been seen.
  # harness/scripts/check-model-releases.mjs's --snapshot flag / adapter default.
  snapshot_path: .agent/model-snapshot.json
  # scripts/check-model-releases.mjs — MAX_FANOUT. A blast-radius limit, not
  # a cost control — see the field's own doc in model-release-detector.mjs.
  max_fanout: 8
  reachability_probe: true   # scripts/probe-models.mjs — drop before preflight spends anything

cadence:
  trigger: model-release            # not the calendar; a quiet month runs nothing
  schedule_cron: '0 0 1 * *'        # 1st of month, 00:00 UTC
  manual_dispatch: true
  manual_overrides:
    - force_models                  # rehearse a quiet month
    - scope                         # force focused/ambitious

roles:
  suggest:
    seat: rotating                  # whichever lab shipped the new model
    max_output_tokens: 32000        # SUGGEST_MAX_TOKENS
    may_emit_edits: true            # optional; tried before the implement seat's attempts
  implement:
    seat: pinned
    model: claude-opus-5            # fallback only — suggester's own edits tried first
    max_output_tokens: 16000
  review:
    seat: pinned
    model: claude-opus-5
    fresh_context: true
    max_output_tokens: 16000
    fails_closed: true              # unparseable verdict counts as rejection
  refine:
    seat: pinned                    # same model as implement
    max_attempts: 3                 # MAX_ATTEMPTS
    reset_between_attempts: true    # pristine tree, including deleting created files

scope:
  mode: earned                      # scripts/lib/context-pack.mjs — recommendScope()
  required_clean_streak: 2          # N most recent generations with a real proposal
  default: focused
  human_override: true              # workflow_dispatch input

evaluation:
  test_commands:
    - npm test                      # game-logic checks
    - npm run test:pipeline         # pipeline/edit-format checks
    - npm run test:browser          # Chromium smoke checks
  preflight_required: true          # must be green BEFORE the agent starts

  # Not part of the paper's original schema sketch — project-specific
  # non-gating plugins. See NOTES.md; neither ships as a harness default.
  quality_plugins:
    - visual-check                  # scripts/lib/visual-check.mjs — canvas/phone-viewport renders, attached to review
    - wordless-play                 # scripts/lib/wordless-play.mjs — non-reader accessibility probe

  scorecard:
    gating: false                   # measured, shown to next model, never blocks merge
    dimensions:
      - thirdPartyRequests
      - wcagViolations
      - touchTargetSize
      - oneHandedReach
      - wordlessPlay
      - timeToFirstFrame
    retired_dimensions:
      - {name: readingLevel, replaced_by: wordlessPlay, reason: 'innerText-based; blind to canvas'}

memory:
  attempts_record: 'docs/generations/gen-{NNN}/attempts.json'   # written on success AND failure
  # harness/lib/escalations.mjs's loadLedger/saveLedger default; ready to
  # read via harness/lib/adapter.mjs's memoryConfig(), though nothing calls
  # it automatically yet — no orchestrator exists to fold proposals in.
  escalation_ledger: 'docs/escalations/ledger.json'
  escalation_consensus:
    models: 3                       # CONSENSUS.models
    labs: 2                         # CONSENSUS.labs — must span labs, not just models
  themes_review:
    dir: 'docs/themes'              # harness/lib/themes.mjs's loadLatestThemesReview default
    cadence_generations: 10
    model: claude-opus-5

deployment:
  verify_strategy: url              # harness/lib/verify-deployment.mjs's verifyUrl()
  production_url: https://masonthecarrot.netlify.app
  # scripts/verify-production.mjs's WATCHED list. styles.css is deliberately
  # excluded: the host minifies CSS on the way out, so a byte-level
  # comparison would be permanently red — see that file's own comment on
  # why a signal that always cries wolf gets muted.
  watched_files:
    - carrot_maze_game.html
    - germ_fighter.html
    - index.html
    - about.html
    - germ_fun_facts.html
    - vegetable_fun_facts.html
    - feedback.js
  rollback: git-tag                 # `git revert gen-NNN`; no dedicated rollback script
  ci:
    runner: ubuntu-latest           # every job; bash steps assume it implicitly (not yet pinned via `shell:`)

notify:
  channel: email
  # scripts/send-digest-email.mjs / send-escalation-email.mjs hardcode SendGrid
  # directly. harness/lib/notify.mjs's registerSender()/getSender() genericised
  # this: "sendgrid" is one registered sender among any a project could add, not
  # a literal the harness special-cases — provider names *which registered
  # sender* delivers the email, nothing more.
  provider: sendgrid
  recipient: cfostermcbride@gmail.com
  recipient_name: Chris             # harness/lib/notify.mjs's buildDigestSystemPrompt()
  from:
    email: support@digitalhumanassistants.io
    name: "Mason's Game Self-Improvement"
  digest_model: claude-opus-5       # written by claude-opus-5 from the real generation record
  digest_style: plain-language
  digest_fallback: terse-template   # used if the plain-language pass fails for any reason
  escalation_notice: true           # separate email once consensus is reached
  # scripts/lib/format-digest.mjs's own system prompt hardcodes two real,
  # well-received example bodies inline, from this project's own history —
  # never extracted to files of their own. calibration_examples below is
  # where the harness version of that would point once/if they are; left
  # empty here rather than fabricated, since NOTES.md's rule is "reconstruct
  # from real enforcement code," and no such files exist in this repo today.
  calibration_examples: []
