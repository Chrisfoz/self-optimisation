name: Binary reconstruction lab checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python3 scripts/install-harness.py --verify
      - run: npm install --prefix harness --no-save --no-package-lock --ignore-scripts js-yaml@5.3.0
      - run: node harness/scripts/validate.mjs
      - run: node --test tests/harness.test.mjs
      - run: python3 -m unittest discover -s tests -q
      - run: python3 lab.py gate
      - run: python3 lab.py replay
