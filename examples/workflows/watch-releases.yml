# Watch for new frontier model releases and open an issue when one ships.
# Generated by `node harness/cli/init.mjs --detector-only`.
#
# This is the detector alone: a monthly check of the labs below that commits
# the "models seen" snapshot and opens an issue when a model you have not
# tried before becomes available. It calls each lab's model listing and
# nothing else, so it costs nothing. The full loop (suggest, implement,
# review, test, pull request) is what plain `init` generates instead.
#
# Needs one repository secret per lab below (Settings -> Secrets and
# variables -> Actions). A lab with no secret is reported "skipped".

name: Watch for new model releases

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write # to commit the updated "models seen" snapshot
  issues: write   # to open an issue when something new ships

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check for new model releases
        id: check
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          node harness/scripts/check-model-releases.mjs \
            --providers anthropic,openai,google,moonshot,deepseek,qwen,xai,meta,zai \
            --snapshot '.agent/model-snapshot.json' \
            > release-check.json

          echo "has-new=$(jq -r '.hasNewReleases' release-check.json)" >> "$GITHUB_OUTPUT"
          echo "model=$(jq -r '.selectedModel // "none"' release-check.json)" >> "$GITHUB_OUTPUT"
          echo "provider=$(jq -r '.selectedProvider // "none"' release-check.json)" >> "$GITHUB_OUTPUT"

      - name: Commit the updated snapshot
        shell: bash
        run: |
          git config user.email "release-watcher@github-actions.local"
          git config user.name "Model Release Watcher"
          git add '.agent/model-snapshot.json'
          git commit -m "Update model snapshot" || echo "No change to commit"
          git push

      # Model and lab names come from a lab's API, so they reach the script
      # through env, never through ${{ }} inside run:.
      - name: Open an issue if something new shipped
        if: steps.check.outputs.has-new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ steps.check.outputs.model }}
          PROVIDER: ${{ steps.check.outputs.provider }}
        run: |
          # The label only exists if you made it, so an unlabelled issue is
          # the fallback rather than a failed step.
          gh issue create \
            --title "New model available: $MODEL ($PROVIDER)" \
            --body "The release watcher found a model it hasn't seen before. Detail in this run's log." \
            --label "model-release" 2>/dev/null || \
          gh issue create \
            --title "New model available: $MODEL ($PROVIDER)" \
            --body "The release watcher found a model it hasn't seen before. Detail in this run's log."
