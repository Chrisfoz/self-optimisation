# Copy this file to project-adapter.yml at YOUR project's root (not inside
# harness/) and fill in every <angle-bracket> placeholder. This is the one
# file the harness reads to know how it applies to *this specific project*
# — see harness/lib/adapter.mjs, the only file in the harness that parses
# it. Angle brackets, deliberately, not square ones: `id: [your-name]` is
# valid YAML for a one-element ARRAY, not a placeholder string, and parses
# silently into the wrong shape — caught by actually running this file
# through js-yaml while building it, not by inspection.
#
# Every field below is marked either LIVE (a real script reads it today) or
# RECORDED (written for the record, deliberately never read back — see the
# closing section for why, and which two fields those are). There is no
# longer a RESERVED category: every field in this file is one or the other,
# which was not true when it was first written.
#
# examples/carrotgame/project-adapter.yml is a full worked instance of this
# same schema, reconstructed from a real installation's enforcement code —
# useful for seeing every field populated with real reasoning attached, not
# meant to be copied over this file.

project:
  id: <your-project-name>
  repository: <https://github.com/you/your-project>
  default_branch: main

  # --- LIVE: the committed goal (docs/curiosity/C1-committed-goal.md).
  # What this project is trying to BECOME, stated once by a person. Shown
  # above the brief to every suggesting model, and the reviewer rejects a
  # change that is correct, safe and tested but moves away from it. Frozen:
  # harness/scripts/check-guarded-paths.mjs refuses a diff that changes it;
  # a model may argue against it through the escalation ledger only.
  # Direction plus constraints, never a metric — a number here would be
  # optimised the way readingLevel was. Optional; delete the block for the
  # goal-free behaviour. `holds` and `away_from` are optional, up to 8 each.
  # goal:
  #   statement: >
  #     Become the thing a nurse reaches for when a frightened child needs
  #     ten minutes of calm, on a shared hospital tablet, with nobody
  #     available to help them use it.
  #   holds:
  #     - A child who has never seen it before can start playing without being told how.
  #   away_from:
  #     - Anything that rewards speed over calm.

# --- LIVE: harness/scripts/check-model-releases.mjs reads this section ----
providers:
  # Which labs to watch for new releases. Delete any you don't have a key
  # for — see the root README's "Getting started" for where keys go
  # (harness/.env.harness.local locally, GitHub Secrets in CI). A bare name is enough; the env
  # var name shown here is only for a human reading the file — the harness
  # already knows each provider's real env var from harness/providers/*.mjs.
  watched:
    - anthropic
    # - openai
    # - google
    # - moonshot
    # - deepseek
    # - qwen
    # - xai
    # - meta
    # - zai

  # Where "which models have I already seen" is remembered between runs.
  snapshot_path: .agent/model-snapshot.json

  # Ceiling on how many newly-released models one run may fan out to — a
  # blast-radius backstop, not a cost control.
  max_fanout: 8

# --- LIVE: harness/lib/edit-format.mjs's compileAllowlist() reads this ----
constitution:
  # Exact paths an autonomous change may edit. Everything else is refused
  # before anything reaches disk — an allowlist, not a denylist.
  allowed_paths:
    - <path/to/an/editable/file>

  # Glob patterns a CREATE block may target — ONLY at a path that doesn't
  # already exist yet. Leave empty if your project has no such surface.
  create_only_paths: []
    # - "tests/**/*.test.js"

  # --- LIVE: harness/scripts/check-guarded-paths.mjs reads the rest of
  # this section. This is the enforcement half of "what may an autonomous
  # change touch" — allowed_paths above is what it MAY edit; everything
  # below is what it may NEVER touch at all, checked against a real git
  # diff in CI.
  frozen_paths: []
    # - ".github/**"                # workflow definitions
    # - "<path to this brief>"      # the agent's own instructions
    # - "package.json"              # or your project's dependency manifest
  append_only_paths: []
    # - "tests/**"                  # new tests may be added; existing ones may not change
  frozen_fields: {}
    # package.json:
    #   - scripts                   # rewriting the test command would defeat every other gate
  churn_ceiling:
    max_files: 50
    max_lines: 10000

  # --- LIVE: harness/lib/scaffold.mjs reads this when it renders your
  # workflow, and harness/lib/adapter.mjs's approvalClass() is the accessor.
  # What happens once a generation has passed every gate:
  #
  #   human-approval-required  the workflow opens a pull request and stops.
  #                            You merge it, or you don't. (DEFAULT)
  #   autonomous-merge         the workflow merges the agent branch into
  #                            your default branch itself and tags the
  #                            generation. Nobody is asked first.
  #
  # ANY OTHER VALUE — a typo, a blank, something a future tool wrote that
  # this version doesn't know — resolves to human-approval-required. Fail
  # closed: an unrecognised value must never be the reason a project starts
  # merging its own changes unattended.
  #
  # This is read at SCAFFOLD time, not at run time: the choice is rendered
  # into .github/workflows/self-improve.yml as one of two sets of steps, so
  # changing it here does nothing until you re-run
  # `node harness/cli/init.mjs --force` to regenerate the workflow. That is
  # deliberate — which merge model a repository has should be answerable by
  # reading its workflow file, not by trusting that a config file and a
  # generated file still agree.
  approval_class: human-approval-required

# --- LIVE: harness/scripts/run-generation.mjs reads these three sections --
# Everything below this point is what turns the pieces above into an actual
# run of the loop — see ARCHITECTURE.md for the diagram this powers.

roles:
  # Where your filled-in briefs live. Copy the two templates in
  # harness/templates/ to these paths and fill in every <placeholder>
  # before your first real run — see the root README's "What only you can
  # provide" table.
  agent_brief_path: .claude/agents/improve.md
  reviewer_brief_path: .claude/agents/review.md

  # The three PINNED seats. Only the suggest seat rotates (to whichever
  # watched lab shipped something new); these stay on a model you chose.
  # Any registered lab's model id works here — the provider is resolved
  # from the id itself, so `gpt-5` or `gemini-3-pro` are as valid as the
  # Anthropic default.
  #
  # IMPORTANT: a pinned model's lab does NOT have to appear in
  # providers.watched above — watching is the detector's scope, pinning is
  # a separate choice. But that lab's API key still has to be a repository
  # secret, or the run fails when it reaches that seat. `init.mjs` works
  # this out for you and wires the union of both sets into the generated
  # workflow; if you change a model here by hand afterward, add the secret
  # yourself.
  #
  # Each seat also takes an OPTIONAL `provider:` naming the lab that serves
  # its model. Leave it out and the lab is worked out from the model id,
  # which is right for every id matching a pattern in harness/providers/.
  # Set it when it doesn't — a model released under a new family name, a
  # joint release, a reseller's id — and that model becomes usable without
  # anyone editing a regex in this harness. It must name a registered
  # provider; the run pins it at startup and fails immediately if it can't.
  suggest:
    max_output_tokens: 32000   # covers a full analysis plus an ambitious edit set
  implement:
    model: claude-opus-5       # the pinned fallback implementer
    # max_output_tokens: 32000 # default; a reasoning model on a large project spends much of it thinking
    # prompt_cache: true      # default. Anthropic only: the proposal and source the implementer rereads on a
    #                         # retry or refinement are cached (a tenth of the input price; the first write is 1.25x).
    # effort: medium          # Anthropic models only: low | medium | high | xhigh | max. Thinking counts
    #                         # against max_output_tokens, so a lower effort leaves more room for the edits.
    # provider: anthropic      # only needed when the id doesn't name its own lab
  review:
    model: claude-opus-5       # pinned — this gate does not rotate
    # effort: medium          # Anthropic models only, same scale as implement above:
    #                         # low | medium | high | xhigh | max. Read at run time.
  rank:
    # Only called when more than one lab proposed this run. LEAVE UNSET (or
    # null) to have the run pick a model from a DIFFERENT family than the
    # implementer, from the model snapshot, among labs whose key is present
    # — a judge prefers its own family's prose (learning/07-whats-actually-new.md
    # §5), and ranking fails safe so the auto-pick costs at worst one
    # ranking. The review seat above is NOT auto-picked: it fails closed and
    # must be a model you chose — but the run warns every time it shares the
    # implementer's family, and it should not.
    model: null
  refine:
    max_attempts: 3            # on the pinned implementer; a direct edit from the
                                # suggesting model is tried first and doesn't count against this
  # Seat promotion by track record — the bet on the curve, extended from the
  # suggest seat to the implement seat. A rotating model whose OWN edit
  # blocks were approved and kept (merged, not closed, not reverted) this
  # many times takes the implement seat from the pinned model above, for as
  # long as it holds the record and its lab's key is present. The review
  # seat is never promoted: it is the gate, and a gate is not a prize. Omit
  # or set 0 to never promote (the default).
  # promotion:
  #   implement_after_self_implemented_approvals: 3

memory:
  escalation_ledger: docs/escalations/ledger.json
  escalation_consensus:
    models: 3
    labs: 2
    # How many generations an escalation may sit BELOW that bar, with nobody
    # mentioning it either way, before the next fan-out is asked about it by
    # name. Optional; harness/lib/escalations.mjs defaults to 5.
    #
    # Why this exists: the bar counts supporters, and nothing counted
    # silence. What actually kills a lone idea is that other models never
    # mention it — it sits at 1/3 forever, and inattention scored identically
    # to judgement. A resurfaced entry is put to the models directly and they
    # must answer AGREE, DISAGREE or IRRELEVANT; three distinct IRRELEVANT
    # judgements retire it, which is a real verdict where silence never was.
    # This does not lower the bar. It asks the question the bar was silently
    # answering on the models' behalf.
    resurface_after: 5
  # Every N generations, one model reads the same history window every
  # suggesting model reads and is asked what principle explains it —
  # abstraction rather than association. Written by
  # harness/scripts/generate-themes-review.mjs, read back into every
  # subsequent suggestion prompt by harness/lib/themes.mjs. The script
  # decides for itself whether a run is a cadence boundary, so the generated
  # workflow runs it every generation rather than keeping a second schedule
  # in sync with the first.
  themes_review:
    dir: docs/themes
    cadence_generations: 10

context:
  # Where generation records accumulate — attempts.json, proposal.md — one
  # directory per run.
  generations_dir: docs/generations

  # Where the record of what each run actually OBSERVED goes — see
  # harness/scripts/record-runtime-evidence.mjs and
  # docs/curiosity/C10-runtime-evidence.md. Every other block in the
  # suggestion prompt describes what this project IS; this is the only one
  # that describes what it DID. Optional: a project that records none simply
  # never gets the section.
  runtime_evidence_dir: docs/runtime

  # Optional: a doc with standing context about how this project's loop is
  # built, sent to the suggestion stage in full. append_only_marker, if your
  # doc has a growing log at the bottom, truncates there rather than sending
  # ever-more text every run — see context-pack.mjs's own doc comment for
  # the incident this guards against.
  # architecture_notes:
  #   path: ARCHITECTURE.md
  #   append_only_marker: "*This log is append-only.*"

  # Test files to index by name (not body) for the suggestion stage — see
  # context-pack.mjs's buildTestIndex(). Defaults to matching
  # test/it/describe, which covers Node's own test runner, Jest, Mocha and
  # Jasmine; override with a custom extractor if your suite uses something
  # else.
  test_files: []
    # - tests/lib/example.test.mjs

  # One-line purpose for each path worth naming in the repo manifest the
  # suggestion stage sees — helps rule out a structurally impossible
  # proposal before it's written. Optional; an empty map is fine.
  purposes: {}
    # index.html: the landing page and game picker

  # A short paragraph about where and how this project actually runs —
  # device, network, session length, audience — sent as-is. This is not a
  # function to call; context-pack.mjs has no builder for it, because it's
  # just prose only you know.
  # platform_notes: >
  #   Runs in any current browser. No specific device or network assumptions.

  history_limit: 3       # how many recent generations get full detail in the prompt

  # --- LIVE: how the suggestion stage sees the source.
  #   full-dump   every editable file, in full, to every suggesting model.
  #               Right for small projects; the cost grows with the source. (DEFAULT)
  #   scoped      a code map (files, sizes, symbols, imports) instead; each
  #               suggesting model names the files it wants, and a second call
  #               shows it those, up to scoped.max_source_chars. Two calls per
  #               model, a fraction of the input on a large project. Compare
  #               the two on your own project with harness/scripts/bench.mjs
  #               (docs/Replay-Bench.md) before switching a default.
  strategy: full-dump
  # scoped:
  #   max_source_chars: 200000   # per suggesting model, on its second call
  #   map_max_chars: 60000       # the map itself; files past it are counted, not listed
  scope_required: 2      # clean first-attempt merges in a row before "ambitious" unlocks

  # --- LIVE: the ambition dial, read at RUN time by run-generation.mjs.
  # How much each generation may ATTEMPT. The gates — independent review,
  # the guard, your tests, the pull request — are identical at every
  # setting; what changes is the size of the change that reaches them.
  #
  #   focused     one small, localised change, every generation.
  #   earned      focused until `scope_required` generations in a row merged
  #               on the first attempt, which earns ONE ambitious generation;
  #               a lone ambitious failure costs one focused generation, two
  #               in a row cost the streak. (DEFAULT)
  #   ambitious   structural work — several files, several hundred lines —
  #               on every run. More rejected attempts, more tokens, and a
  #               shipped change that is harder to read in a diff. Pair it
  #               with the pull-request merge model, keep the budget cap on,
  #               and know that `harness/scripts/revert-generation.mjs NNN`
  #               undoes a generation that passed every gate and still
  #               should not have shipped.
  #
  # Anything unrecognised resolves to `earned`, never to `ambitious`. A
  # single run can be overridden from the Actions tab ("Run workflow" →
  # scope) without changing this file. docs/Ambition-Control.md has the
  # risk table for each setting.
  ambition: earned

# --- LIVE: harness/scripts/run-generation.mjs reads this (via
# harness/lib/adapter.mjs's budgetConfig()) --------------------------------
# The most tokens one generation may spend, input plus output, across every
# model call it makes. Checked twice: projected before the fan-out (the
# suggestion prompt's size times the number of newly released models — if
# that alone exceeds the cap the run is refused, recorded as `over-budget`,
# and nothing is called) and actually, between refine attempts (the loop
# stops with a `budget-exhausted` attempt and the generation is abandoned).
# Every attempts.json carries a `spend` block with the real totals per model
# and per stage, from the usage the provider reported.
#
# Tokens, not money: a price table in this file would rot, and a wrong price
# is worse than none. This bounds ONE run. It does not bound a month in
# which nine labs each ship something — set a spending limit at each
# provider as well. Delete the section, or set it to 0, for no cap.
budget:
  max_generation_tokens: 2000000

# --- LIVE: harness/scripts/verify-deployment.mjs and promote.mjs read this
# section (via harness/lib/adapter.mjs's deploymentConfig()). Neither is
# wired to run automatically after run-generation.mjs yet — each is a
# standalone CLI a workflow's own job calls — but all four strategies below
# are real, tested code today, not a stub. Leave verify_strategy at "none"
# (the default) if you don't have a deployment to check.
deployment:
  verify_strategy: none     # url | registry | artifact | none — all four implemented

  # --- "url": fetch the live site, compare canonicalised content to what's
  # committed. See harness/lib/verify-deployment.mjs's verifyUrl().
  # production_url: https://your-project.example.com
  # watched_files: []
  #   - index.html

  # --- "registry": poll a package registry until it carries the version
  # that was just tagged. ecosystem selects the API shape: npm, pypi,
  # nuget, or maven (maven needs group_id/artifact_id instead of package).
  # version is usually left unset here — harness/scripts/verify-deployment.mjs
  # resolves it at run time (--version / VERSION env var / this field / for
  # npm only, read from version_file's "version" field, package.json by
  # default) since it changes every release rather than living in this file.
  # registry:
  #   ecosystem: npm
  #   package: your-package-name
  #   # group_id: com.example        # maven only
  #   # artifact_id: your-artifact   # maven only
  #   # version: 1.2.3               # usually resolved at run time instead — see above
  #   # version_file: package.json   # npm only; default shown
  #   # registry_url: https://registry.npmjs.org   # override for a private/mirrored registry

  # --- "artifact": build the project, confirm the expected output exists,
  # optionally run it (or a smoke-test wrapper) and require a clean exit.
  # Any of the three may be omitted; each omitted check is simply skipped.
  # See harness/lib/verify-deployment.mjs's verifyArtifact().
  # artifact:
  #   build_command: npm run build
  #   path: dist/cli.js
  #   smoke_command: node dist/cli.js --version

  ci:
    runner: ubuntu-latest

# --- LIVE: harness/scripts/send-digest.mjs and send-escalation-notice.mjs
# read this section (via harness/lib/adapter.mjs's notifyConfig()). Neither
# is wired to run automatically either — same standalone-CLI situation as
# deployment above. `provider` names a sender registered in
# harness/lib/notify.mjs via registerSender() — "sendgrid" ships built in;
# add your own (Slack, a webhook, another email API) by registering one
# under its own name and pointing `provider` at it, no harness code needs
# to change. Its API key is read from `<PROVIDER_NAME_UPPERCASE>_API_KEY`
# (SENDGRID_API_KEY for the built-in sender).
# notify:
#   channel: email
#   provider: sendgrid
#   recipient: you@example.com
#   recipient_name: <your first name>       # used in the digest's system prompt
#   from:
#     email: bot@your-project.example.com
#     name: <your project>'s Self-Improvement
#   digest_model: claude-opus-5             # writes the plain-language email
#   escalation_notice: true                 # separate email once consensus is reached
#   calibration_examples: []                # paths to real, well-received email
#     # - docs/calibration/example-1.md     # bodies from YOUR project's own history —
#                                            # optional; omit until you have some

# --- RECORDED, not reserved: these two sections are a written record of
# what init.mjs baked into your generated workflow. Nothing reads them back
# out of this file at run time, and — unlike approval_class, which used to
# sit here — nothing ever will. That is the decision, not a gap:
#
#   cadence.schedule_cron   becomes `on.schedule.cron` in the generated
#                           workflow. GitHub Actions is what actually runs
#                           on a schedule; a cron here that Actions never
#                           reads would produce a user who believes their
#                           loop runs monthly when nothing schedules it
#                           (console/DESIGN.md §2.3).
#   evaluation.test_commands becomes the preflight and post-change test
#                           steps in that same workflow. A run must fail on
#                           the commands CI actually ran, not on a list in a
#                           file the agent's own branch could in principle
#                           have edited between the two.
#
# The shared reason: a value that is baked into a generated file has exactly
# one source of truth at run time — the generated file. Reading it back from
# here as well would create two, which can silently disagree, and the
# disagreement would be invisible precisely when it mattered. Change either
# of these and re-run `node harness/cli/init.mjs --force` to regenerate the
# workflow; editing this file alone changes nothing.
#
# THE ONE EXCEPTION, a shared installation (`init --shared <sha>`, or a
# console deployment with SELF_OPTIMISATION_SHARED_REF set). Its workflow is
# a short call to the harness repository's shared workflow and has no test
# steps of its own to bake anything into, so there test_commands, and the
# setup_commands below, are LIVE: read once per run, from the default branch,
# before any agent change exists, and saved for both test gates to use
# (harness/lib/workflow-config.mjs). One source of truth per run still holds;
# a change here takes effect on the next run. The cron is still baked into
# that short workflow, and still only recorded here.
#
# cadence.trigger is documentation of intent with no mechanism behind it at
# all: the real trigger is a model release (learning/01-principles.md,
# principle 1), and the cron is only how often the harness goes looking.

# cadence:
#   trigger: model-release
#   schedule_cron: '0 0 1 * *'

# evaluation:
#   test_commands: []
#   preflight_required: true
#   setup_commands: []               # shared installations only: installs the project's
#                                    # dependencies before preflight, e.g. [npm ci --ignore-scripts]

# --- SHARED installations only: which harness commit the workflow calls ---
# Written by init --shared and by the console; read back by
# `init --from-adapter` to regenerate the workflow at the same pin. The run
# itself uses whatever commit the workflow file names, so keep the two in
# step when you upgrade. A full commit SHA, never a branch or tag.
#
# harness:
#   shared:
#     repository: Chrisfoz/self-optimisation
#     ref: <full 40-character commit sha>
#     label: <v0.1.0>                # optional, shown beside the pin
#
# One limit to know: a module path in evaluation.evaluators is resolved from
# your project's root, and a shared installation has no harness/ there, so
# the shipped example (harness/plugins/evaluators/...) cannot be named by that
# path. Copy the plugin into your project and point at the copy. Evaluators
# never gate, so a plugin that fails to load is recorded, not fatal.

# --- LIVE: the same test_commands, run INSIDE the generation -------------
# After each attempt's edits apply and before the independent review, the
# harness runs test_commands against that exact tree (a baseline run on the
# untouched tree comes first). A failure goes back to the implementer as
# evidence — the failing command and the end of its output — for the next
# attempt to fix, within refine.max_attempts and the token budget; a pass is
# shown to the reviewer. Without this, a failing change reached the
# workflow's test step only after the loop had finished and could not be
# repaired. On by default whenever test_commands is set; it costs test time,
# not tokens. See harness/lib/test-runner.mjs.
#
# SECURITY: these tests run model-written code BEFORE review. The child
# process gets a scrubbed environment — every variable shaped like a
# credential (…_KEY, …_TOKEN, …_SECRET, GH_PAT, …) and every lab key the
# harness knows is removed. Name one here only if your suite truly needs it.
#
# evaluation:
#   test_in_loop: true
#   test_timeout_seconds: 600        # per command; the whole process tree is killed on timeout
#   test_env_passthrough: []         # e.g. [DATABASE_URL] — deliberately empty by default

# --- LIVE: harness/scripts/run-evaluators.mjs reads this ------------------
# Quality-dimension evaluator plugins — the measurements that are NOT gates.
# `test_commands` above are the gates: they run in CI and a failure stops the
# generation. These run afterwards and can stop nothing. A plugin that
# throws, hangs, or returns nonsense produces a recorded error and the
# generation proceeds — see harness/plugins/evaluators/README.md, which is
# the interface a plugin implements and the reasoning for enforcing
# "non-gating" in the runner rather than trusting each plugin.
#
# Results are written to <generations_dir>/gen-NNN/metrics.json and read back
# into the NEXT generation's suggestion prompt, as measured context that is
# explicitly not a target. A project with none configured gets a prompt
# byte-identical to one from before any of this existed.
#
# `module` is resolved relative to the project root, so your own plugin lives
# in your own repository, version-controlled beside the thing it measures.
# Nothing has to be contributed back to this harness to be used.

# evaluation:
#   evaluators:
#     - module: harness/plugins/evaluators/source-weight/index.mjs
#       config:
#         paths: ['src/**/*.js']     # defaults to the whole tree
#         largeFileLines: 500

# --- LIVE: a plugin may also RENDER, simulate or probe, and hand back what
# it saw rather than only a number — see docs/Tool-Use-Design.md. It writes
# into the one directory the runner gives it (`artifactsDir`, inside that
# generation's own record folder) and returns:
#
#   { metrics: [...],
#     artifacts: [ {kind: 'image', file: 'frame.png', label: 'level 3'},
#                  {kind: 'observation', label: 'reachability',
#                   text: 'apex 1.9m; the gap at x=44 needs 2.1m'} ] }
#
# Images are ATTACHED to the next generation's suggestion call; observations
# are read into its prompt as prose. This is where Blender, a physics probe,
# a headless browser or a build-size check belongs — the harness ships none
# of them and has no opinion about your ecosystem.

# --- LIVE: the same interface, run INSIDE a generation instead of after it.
# harness/scripts/run-generation.mjs loads this one and hands it to
# harness/lib/review.mjs as `captureVisual`, so the REVIEWER sees a render of
# the change under review rather than only its diff. Fails safe: a plugin
# that throws, hangs or renders nothing leaves the review exactly as it is
# without one. Omit the whole block for that (the default).
#
#   visual_capture:
#     module: tools/render-for-review.mjs
#     config:
#       viewport: 390x844
