# Campaign rehearsal of the portable harness on a Python CLI with no visual
# surface — WORKPLAN 2.1's "different on purpose" second project.
project:
  id: icd-mapper
  description: "a small Python command-line tool that reads ICD-10 to ICD-10-AM mapping exports and writes reports and spreadsheets"
  default_branch: main
harness:
  version: campaign
providers:
  watched: [moonshot, deepseek, zai]
  snapshot_path: .agent/model-snapshot.json
  max_fanout: 3
constitution:
  allowed_paths:
    - icd_mapper.py
    - icd_mapper_list.py
    - icd_mapper_unique.py
    - excel_to_txt.py
  create_only_paths: []
  frozen_paths:
    - ".github/**"
    - "tests/**"
    - "evaluators/**"
    - "harness/**"
    - "project-adapter.yml"
    - ".claude/**"
  append_only_paths: []
  frozen_fields: {}
  churn_ceiling:
    max_files: 4
    max_lines: 600
  approval_class: human-approval-required
roles:
  agent_brief_path: .claude/agents/improve.md
  reviewer_brief_path: .claude/agents/review.md
  suggest:
    max_output_tokens: 32000
  implement:
    model: claude-opus-5
  review:
    model: gpt-5.5
  rank:
    model: null
  refine:
    max_attempts: 3
memory:
  escalation_ledger: docs/escalations/ledger.json
  themes_review:
    dir: docs/themes
    cadence_generations: 10
context:
  generations_dir: docs/generations
  runtime_evidence_dir: docs/runtime
  strategy: full-dump
  test_files:
    - tests/test_icd_mapper.py
  history_limit: 3
  ambition: focused
deployment:
  verify_strategy: none
budget:
  max_generation_tokens: 600000
evaluation:
  test_commands:
    - python -m pytest -q tests
  test_in_loop: true
  test_timeout_seconds: 120
  evaluators:
    - module: evaluators/robustness.mjs
    - module: harness/plugins/evaluators/source-weight/index.mjs
      config:
        paths: ["*.py"]
