name: CI

# Runs the harness's OWN test suite (tests/lib/) on every PR and every push
# to main. This is not a template for a target project's CI — it's this
# repository dogfooding harness/lib/ and harness/providers/ the same way any
# real project would, per README.md's "Testing this harness itself" section.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The exact minimum package.json's `engines` declares, and the
        # current LTS. Testing only a floating major is how this workflow
        # once went red on every run for weeks: Node 20 read the test glob
        # as a literal filename, and nothing ran. If you raise `engines`,
        # raise the first entry with it — tests/lib/ci-config.test.mjs
        # fails when the two disagree.
        node: ['22.11.0', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tests/scripts/workflow-shell.test.mjs executes the generated
      # workflow's `run:` blocks under GitHub's own bash flags, and needs jq
      # to do it. Both ship on ubuntu-latest; this step makes a missing one
      # an explicit failure here rather than a silently skipped test.
      - name: Check the tools the shell tests need
        run: bash --version | head -1 && jq --version

      - name: Run the harness's own test suite
        env:
          REQUIRE_SHELL_TESTS: 'true'
        run: npm test

  # The console's Dockerfile, built and run for real: it must answer /healthz,
  # and no env file may reach the image even when the build context holds
  # one (a fake key is planted first to prove .dockerignore keeps it out).
  console-image:
    name: Console image builds, answers /healthz, and holds no env file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plant a key file where a real checkout might have one
        run: echo 'ANTHROPIC_API_KEY=sk-ant-must-not-ship' > harness/.env.harness.local

      - name: Build
        run: docker build -t self-optimisation-console .

      - name: No env file in the image
        run: |
          found=$(docker run --rm self-optimisation-console find /app -name '.env*' ! -name '*.example')
          if [ -n "$found" ]; then echo "::error::env file in the image: $found"; exit 1; fi

      - name: Answers /healthz
        run: |
          docker run -d --name console -p 3000:3000 self-optimisation-console
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/healthz && exit 0
            sleep 1
          done
          docker logs console
          exit 1
